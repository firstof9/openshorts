# Apex to www, permanently.
#
# Traefik was doing this with `redirectregex.permanent=false`, which answers 307.
# A temporary redirect does not consolidate ranking signals, so every canonical
# on the site named a URL that only ever redirects. Coolify regenerates its
# Traefik labels on every deploy and hardcodes permanent=false, so pinning it
# there would be overwritten; the redirect lives here instead, in version
# control. This requires the app's `redirect` setting in Coolify to be `both`,
# so Traefik routes the apex through to this container rather than redirecting
# it first.
server {
    listen 80;
    server_name openshorts.app;
    return 301 https://www.openshorts.app$request_uri;
}

server {
    # Explicitly the default server: the block above claims a specific
    # server_name, and without this marker nginx would fall back to whichever
    # block is declared first.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Internal Docker resolver for dynamic upstreams
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $renderer_upstream http://renderer:3100;

    # Proxy backend API requests (POST /api/process, etc.)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy generated media and thumbnails served by backend
    location ~ ^/(videos|thumbnails)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy render service
    location /render/ {
        proxy_pass $renderer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The public gallery and per-video pages are server-rendered by the backend
    # and only exist on the API service. Send them to BACKEND_REDIRECT_URL
    # (defaults to https://api.openshorts.app, configurable via env var for self-hosting).
    location /gallery {
        return 301 ${BACKEND_REDIRECT_URL}$request_uri;
    }
    # The pricing page lives at #/pricing (hash routing). /pricing is what
    # people and emails type; send it there instead of a 404.
    location = /pricing {
        return 301 /#/pricing;
    }
    location /video/ {
        return 301 ${BACKEND_REDIRECT_URL}$request_uri;
    }

    # index.html must NOT be cached — it points at the hashed asset bundle, so a
    # stale cached copy keeps loading the previous deploy's JS. (nginx add_header
    # doesn't inherit into a location that sets its own, so the security headers
    # are repeated here.)
    #
    # $uri.html comes before $uri/ so the build-time SEO pages
    # (/alternatives/opus-clip and friends) are served at their clean path with a
    # 200. Resolving them as directories instead would make nginx 301 to a
    # trailing-slash URL, so every canonical would point at a redirect.
    #
    # Unknown paths get a real 404, not the SPA shell. The app routes entirely
    # through the hash (#/pricing, #/auth/callback), which never reaches the
    # server, so there is no deep link that needs the fallback — and answering
    # 200 with identical markup for every made-up path made the whole site look
    # like one page duplicated infinitely to a crawler.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
