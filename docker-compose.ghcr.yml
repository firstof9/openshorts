services:
  backend:
    image: ghcr.io/firstof9/openshorts:latest
    container_name: openshorts-backend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Video encoder: x264 | nvenc | auto
      - FFMPEG_ENCODER=${FFMPEG_ENCODER:-x264}
      # Transcription settings
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
      # Max file upload size in MB (defaults to 4096 = 4GB)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-4096}
      # Optional external render service URL
      - RENDER_SERVICE_URL=http://renderer:3100
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/firstof9/openshorts-frontend:latest
    container_name: openshorts-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    environment:
      # Optional backend URL for gallery and video redirects (defaults to http://backend:8000)
      - BACKEND_REDIRECT_URL=${BACKEND_REDIRECT_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy

  renderer:
    image: ghcr.io/firstof9/openshorts-renderer:latest
    container_name: openshorts-renderer
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
